<!doctype html>
<!-- تم حذف manifest لتجنب حفظ النسخة القديمة -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>مرتضى العريفي 07735176323</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        min-height: 100vh;
        background-color: #ffffff !important;
        background-image: url('Background.jpg?v=2') !important; /* إضافة v=2 لتحديث الصورة */
        background-size: contain !important;
        background-position: center center !important;
        background-repeat: no-repeat !important;
        background-attachment: fixed !important;
        color: #1e2732;
        font: 15px/1.45 "Segoe UI", system-ui, sans-serif;
      }

      #brand {
        text-align: center;
        padding: 8px 10px;
        background: rgba(14, 17, 22, 0.9);
        border-bottom: 1px solid #1e2732;
      }
      #brand img {
        width: 28px;
        height: 28px;
        margin-right: 8px;
        border-radius: 50%;
        vertical-align: middle;
        object-fit: cover;
      }
      #brand b {
        font-size: 15px;
        font-weight: 700;
        letter-spacing: 0.14em;
        color: #e6ebf2;
        vertical-align: middle;
      }

      #spin {
        position: fixed;
        top: calc(50% + 20px);
        left: 50%;
        width: 46px;
        height: 46px;
        margin: -23px 0 0 -23px;
        border: 4px solid rgba(30, 39, 50, 0.2);
        border-top-color: #0056b3;
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }

      #msg {
        position: fixed;
        top: 85%;
        left: 0;
        right: 0;
        text-align: center;
        font-size: 18px;
        font-weight: bold;
        letter-spacing: 0.5px;
        display: none;
        color: #0e1116;
        background: rgba(255, 255, 255, 0.85);
        padding: 6px;
      }

      #wrap { padding: 0; }
      #state, #out { display: none; }

      body.done #spin, body.fail #spin { display: none; }
      body.fail #msg { display: block; }
    </style>
  </head>
  <body>
    <div id="brand">
      <img src="my-logo.jpg?v=2" alt="" width="28" height="28"/> 
      <b>مرتضى العريفي - 07735176323</b>
    </div>
    <div id="spin"></div>
    <div id="msg">Restart your console</div>
    <div id="wrap">
      <div id="state"></div>
      <div id="out"></div>
    </div>
    <script type="module">
      import "./jb.js?v=11"; /* تغيير رقم الإصدار إلى 11 */
    </script>
  </body>
</html>
