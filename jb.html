<!doctype html>
<html lang="en" manifest="cache.appcache">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>RAW GAME</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        min-height: 100%;
        /* إضـافـة صورة الخلفية وإلغاء اللون الأسود الثابت */
        background-image: url('Background.jpg') !important;
        background-size: cover !important;
        background-position: center !important;
        background-repeat: no-repeat !important;
        background-attachment: fixed !important;
        color: #c8ced8;
        font:
          15px/1.45 "Segoe UI",
          system-ui,
          sans-serif;
      }
      #brand {
        text-align: center;
        padding: 8px 10px;
        /* خلفية شريط الشعار (شبه شفافة لتعطي مظهراً احترافياً فوق صورة المحل) */
        background: rgba(14, 17, 22, 0.85);
        border-bottom: 1px solid rgba(30, 39, 50, 0.8);
        backdrop-filter: blur(5px);
      }
      #brand img {
        width: 28px;
        height: 28px;
        margin-right: 8px;
        border-radius: 50%;
        vertical-align: middle;
        object-fit: cover;
      }
      #brand b {
        font-size: 15px;
        font-weight: 700;
        letter-spacing: 0.14em;
        color: #e6ebf2;
        vertical-align: middle;
      }

      /* running: a spinner under the brand. jb.js sets body.done / body.fail / body.log. */
      #spin {
        position: fixed;
        top: calc(50% + 20px);
        left: 50%;
        width: 46px;
        height: 46px;
        margin: -23px 0 0 -23px;
        border: 4px solid rgba(30, 39, 50, 0.7);
        border-top-color: #7fd0a0;
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      #msg {
        position: fixed;
        top: 50%;
        left: 0;
        right: 0;
        transform: translateY(-50%);
        text-align: center;
        font-size: 18px;
        font-weight: bold;
        letter-spacing: 0.5px;
        display: none;
        color: #ffffff;
        /* ظلال خلف النص ليكون واضحاً وقابلاً للقراءة فوق صورة الخلفية */
        text-shadow: 0px 2px 8px rgba(0, 0, 0, 0.9);
      }
      #wrap {
        padding: 0;
      }
      #state,
      #out {
        display: none;
      }

      body.done #spin {
        display: none;
      }
      body.fail #spin {
        display: none;
      }
      body.fail #msg {
        display: block;
      }

      /* ?log=1 -- the full step log, styled like the landing. */
      body.log #spin,
      body.log #msg {
        display: none;
      }
      body.log #wrap {
        padding: 14px 18px;
      }
      body.log #state {
        display: block;
        font-size: 22px;
        font-weight: 700;
        margin: 0 0 8px;
        text-shadow: 0px 2px 6px rgba(0, 0, 0, 0.8);
      }
      body.log #out {
        display: block;
        white-space: pre-wrap;
        font:
          12px/1.45 Consolas,
          monospace;
        /* جعل صندوق السجل شبه شفاف ليظهر جمالية الخلفية */
        background: rgba(17, 21, 27, 0.85);
        border: 1px solid rgba(30, 39, 50, 0.8);
        border-radius: 5px;
        padding: 10px 12px;
        height: calc(100vh - 141px);
        overflow-y: auto;
        backdrop-filter: blur(4px);
      }
      .ok {
        color: #7fd0a0;
      }
      .bad {
        color: #d08a7f;
      }
      .warn {
        color: #d8c07f;
      }
      .safe {
        color: #7fd0a0;
      }
      .danger {
        color: #d08a7f;
      }
      code {
        color: #9fb3d0;
      }
</style>
  </head>
  <body>
    <div id="brand">
      <img src="my-logo.jpg" alt="" width="28" height="28"/> 
      <b>RAW GAME</b>
    </div>
    <div id="spin"></div>
    <div id="msg">Restart your console</div>
    <div id="wrap">
      <div id="state"></div>
      <div id="out"></div>
    </div>
    <script type="module">
      import "./jb.js?v=10";
    </script>
  </body>
</html>
